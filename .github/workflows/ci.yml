name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make build
      - run: ./dist/codex-changes check --demo --file 读出时间.md
      - name: Cross-compile without CGO
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/codex-changes-linux-arm64 ./cmd/codex-changes
